services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html # Optional: for quick testing if you already built locally
    restart: always

  # For development, you might want a separate service
  frontend-dev:
    image: oven/bun:1.1
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: bun run dev --host
    environment:
      - NODE_ENV=development
